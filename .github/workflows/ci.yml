name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: Run shellcheck on the action scripts
        run: shellcheck -x -s bash src/*.sh

      - name: Syntax check the test suite
        run: bash -n tests/run_tests.sh

      - name: Run actionlint
        uses: docker://rhysd/actionlint:latest

  test:
    name: Script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run test suite
        run: bash tests/run_tests.sh
