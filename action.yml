name: OpenConnect VPN Connector
description: Connect to a VPN using OpenConnect. Pair with disconnect/action.yml to tear the tunnel down.
author: Persi.Liao
branding:
  icon: 'globe'
  color: 'blue'

inputs:
  server:
    description: 'VPN server address'
    required: true
  username:
    description: 'VPN username'
    required: true
  password:
    description: 'VPN password'
    required: true
  group:
    description: 'VPN group (optional)'
    required: false
  protocol:
    description: 'VPN protocol type (default: anyconnect)'
    required: false
    default: 'anyconnect'
  cert:
    description: 'Client certificate in PEM format, including the key (optional)'
    required: false
  cert_key:
    description: 'Private key in PEM format when it is not part of cert (optional)'
    required: false

outputs:
  vpn_ip:
    description: 'IPv4 address assigned to the tunnel interface (empty when it could not be detected)'
    value: ${{ steps.connect.outputs.vpn_ip }}
  pid:
    description: 'PID of the backgrounded openconnect process'
    value: ${{ steps.connect.outputs.pid }}
  log_file:
    description: 'Path of the openconnect log, useful when the connection fails'
    value: ${{ steps.connect.outputs.log_file }}

runs:
  using: 'composite'
  steps:
    - name: Connect to VPN
      id: connect
      shell: bash
      run: ${{ github.action_path }}/src/main.sh
      env:
        VPN_SERVER: ${{ inputs.server }}
        VPN_PROTOCOL: ${{ inputs.protocol }}
        VPN_USER: ${{ inputs.username }}
        VPN_PASSWORD: ${{ inputs.password }}
        VPN_GROUP: ${{ inputs.group }}
        VPN_CERT: ${{ inputs.cert }}
        VPN_CERT_KEY: ${{ inputs.cert_key }}
